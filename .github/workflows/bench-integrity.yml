name: Bench integrity
on: [push, pull_request]
jobs:
  deterministic-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: browser-actions/setup-chrome@v2
      - run: bun install --frozen-lockfile
      # Subprocess- and Chromium-heavy tests run in isolated phases via this script
      # to avoid CI runner contention, lost stdin, and browser timeouts.
      - run: bun run test:deterministic
      - run: bun bench/src/cli.ts swe health all
